<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schottky Diode Energy Band Simulator</title>
    <style>
        :root {
            --bg: #f8fafc;
            --panel: #ffffff;
            --text: #1e293b;
            --primary: #0288d1; 
            --border: #cbd5e1;
            --metal-fill: #b3b3b3;
            --val-fill: #8a8a8a;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            background-color: var(--panel);
            border-radius: 12px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.06);
            padding: 30px;
            max-width: 900px;
            width: 100%;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            text-align: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            font-weight: 600;
            font-size: 0.95rem;
            color: #475569;
        }

        select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #94a3b8;
            font-size: 0.95rem;
            background-color: white;
            cursor: pointer;
            outline: none;
        }

        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(2, 136, 209, 0.2);
        }

        .svg-container {
            width: 100%;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .overlay-panel {
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .overlay-panel.left { top: 15px; left: 15px; }
        .overlay-panel.right { top: 15px; right: 15px; text-align: right; }
        .overlay-title { display: block; font-weight: 800; color: var(--primary); margin-bottom: 8px; font-size: 1.1rem;}

        .band-path { fill: none; stroke: black; stroke-width: 2.5; transition: d 0.4s ease; }
        .dashed-line { stroke: #555; stroke-dasharray: 6 4; stroke-width: 1; transition: all 0.4s ease; }
        .ef-line { stroke: var(--primary); stroke-width: 3; stroke-dasharray: 10 5; transition: all 0.4s ease; }
        
        .math { font-family: "Times New Roman", Times, serif; font-style: italic; }
        .label { font-size: 17px; fill: black; user-select: none; }
        .label-blue { font-size: 17px; fill: var(--primary); user-select: none; }
        .label-small { font-size: 13px; fill: var(--primary); user-select: none; font-weight: bold; }

        .analysis-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #e1f5fe;
            border-left: 4px solid var(--primary);
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .analysis-data {
            font-size: 1.05rem;
            line-height: 1.5;
        }

        .data-value { font-weight: bold; color: #01579b; }
        .ohmic-warning { color: #d32f2f; font-weight: bold; }

    </style>
</head>
<body>

    <div class="container">
        <h2>Schottky Diode Energy Band Simulator</h2>
        
        <!-- Bias Control -->
        <div class="controls">
            <div class="control-group">
                <label for="bias-select">Applied Bias:</label>
                <select id="bias-select" onchange="updateDiagram()">
                    <option value="isolated">Isolated (Before Contact)</option>
                    <option value="eq" selected>Equilibrium (V = 0)</option>
                    <option value="forward">Forward Bias</option>
                    <option value="reverse">Reverse Bias</option>
                </select>
            </div>
        </div>

        <div class="svg-container">
            
            <!-- Metal Selection Overlay -->
            <div class="overlay-panel left">
                <span class="overlay-title">METAL</span>
                <select id="metal-select" onchange="updateDiagram()">
                    <option value="Pt">Platinum (Pt) - 5.65 eV</option>
                    <option value="Pd">Palladium (Pd) - 5.12 eV</option>
                    <option value="Au">Gold (Au) - 5.10 eV</option>
                    <option value="W">Tungsten (W) - 4.55 eV</option>
                    <option value="TiSi2">Titanium Disilicide (TiSi₂) - 4.50 eV</option>
                    <option value="Ti">Titanium (Ti) - 4.33 eV</option>
                    <option value="Al" selected>Aluminum (Al) - 4.10 eV</option>
                    <option value="Mg">Magnesium (Mg) - 3.66 eV</option>
                </select>
            </div>

            <!-- Semiconductor Selection Overlay -->
            <div class="overlay-panel right">
                <span class="overlay-title">SEMICONDUCTOR</span>
                <select id="semi-select" onchange="updateDiagram()" style="margin-bottom: 8px;">
                    <option value="Si" selected>Silicon (Si)</option>
                    <option value="Ge">Germanium (Ge)</option>
                    <option value="GaAs">Gallium Arsenide (GaAs)</option>
                    <option value="GaN">Gallium Nitride (GaN)</option>
                    <option value="AlAs">Aluminum Arsenide (AlAs)</option>
                </select><br>
                <select id="doping-select" onchange="updateDiagram()">
                    <option value="n" selected>n-type (Moderate)</option>
                    <option value="n+">n+ type (Heavy)</option>
                    <option value="p">p-type (Moderate)</option>
                    <option value="p+">p+ type (Heavy)</option>
                </select>
            </div>

            <svg viewBox="0 0 800 620" id="diagram">
                <!-- Definitions for markers -->
                <defs>
                    <marker id="arrow-start" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
                        <path d="M 10 0 L 0 5 L 10 10 z" fill="#0288d1" />
                    </marker>
                    <marker id="arrow-end" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#0288d1" />
                    </marker>
                </defs>

                <!-- Metal Region Background -->
                <path id="metal-region" fill="var(--metal-fill)" d="" style="transition: d 0.4s ease;" />
                
                <!-- Interface Lines (Separated for isolated view) -->
                <line id="surf-m" y1="120" y2="570" stroke="#333" stroke-width="1.5" style="transition: all 0.4s ease;" />
                <line id="surf-s" y1="120" y2="570" stroke="#333" stroke-width="1.5" style="transition: all 0.4s ease;" />

                <!-- Vacuum Levels (Isolated only) -->
                <line id="vac-m" stroke="#333" stroke-width="1.5" style="transition: all 0.4s ease;" />
                <line id="vac-s" stroke="#333" stroke-width="1.5" style="transition: all 0.4s ease;" />

                <!-- Semiconductor Valence Band Shading -->
                <path id="val-region" fill="var(--val-fill)" d="" style="transition: d 0.4s ease;" />

                <!-- Fermi Levels -->
                <line id="ef-metal" class="ef-line" />
                <text id="ef-label-m" class="label-blue math">E_{Fm}</text>
                
                <line id="ef-semi" class="ef-line" />
                <text id="ef-label-s" class="label-blue math">E_{Fs}</text>

                <!-- Semiconductor Band Lines -->
                <path id="ec-line" class="band-path" d="" />
                <path id="ev-line" class="band-path" d="" />
                
                <!-- Intrinsic Fermi Level (Isolated only) -->
                <line id="efi-line" class="dashed-line" style="transition: all 0.4s ease;" />
                <text id="efi-label" class="label math" x="760">E_{Fi}</text>

                <text id="ec-label" x="760" class="label math">E_c</text>
                <text id="ev-label" x="760" class="label math">E_v</text>

                <!-- Annotations & Extension Lines -->
                <!-- x=0 Label -->
                <text id="label-x0" x="210" y="490" class="label math" style="font-size: 15px; transition: all 0.4s ease;">x = 0</text>
                
                <!-- x=xn Dashed line and Label -->
                <line id="line-xn" class="dashed-line" />
                <text id="label-xn" class="label math" style="font-size: 15px;">x = x_n</text>

                <!-- Isolated Arrows -->
                <line id="arrow-phi-m" stroke="var(--primary)" stroke-width="1.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" style="transition: all 0.4s ease;" />
                <text id="label-phi-m" class="label-blue math">eφ_m</text>

                <line id="arrow-chi" stroke="var(--primary)" stroke-width="1.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" style="transition: all 0.4s ease;" />
                <text id="label-chi" class="label-blue math">eχ</text>

                <line id="arrow-phi-s" stroke="var(--primary)" stroke-width="1.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" style="transition: all 0.4s ease;" />
                <text id="label-phi-s" class="label-blue math">eφ_s</text>

                <!-- Barrier Height Arrow & Text -->
                <line id="ext-ec0" class="dashed-line" stroke="#aaa" />
                <line id="arrow-phi" stroke="var(--primary)" stroke-width="1.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
                <text id="label-phi" class="label-blue math">eφ_{B0}</text>
                <text id="label-phi-name" class="label-small">Schottky Barrier Height</text>

                <!-- Built-in Potential Arrow & Text -->
                <line id="ext-c0-right" class="dashed-line" stroke="#aaa" />
                <line id="arrow-vbi" stroke="var(--primary)" stroke-width="1.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
                <text id="label-vbi" class="label-blue math">e(V_{bi})</text>

                <!-- Author Signature -->
                <text x="780" y="605" class="label" style="font-size: 14px; fill: #64748b; text-anchor: end; font-weight: normal;">Mahmudul Hasan(2202156)</text>
            </svg>
        </div>

        <div class="analysis-box">
            <div class="analysis-data" id="analysis-text">
                <!-- Injected via JS -->
            </div>
            <div id="contact-status"></div>
        </div>

    </div>

    <script>
        // Physics Material Data
        const metals = {
            "Pt": 5.65, "Pd": 5.12, "Au": 5.10, "W": 4.55, "TiSi2": 4.50, "Ti": 4.33, "Al": 4.10, "Mg": 3.66
        };

        const semiconductors = {
            "Si": { eg: 1.12, chi: 4.05 },
            "Ge": { eg: 0.66, chi: 4.00 },
            "GaAs": { eg: 1.42, chi: 4.07 },
            "GaN": { eg: 3.40, chi: 4.10 },
            "AlAs": { eg: 2.16, chi: 3.50 }
        };

        const X_INT = 250; 
        const Y_EF = 320;  // Metal Fermi Level Y-coordinate (Base)
        const SCALE = 65;  // Pixels per eV

        function updateDiagram() {
            const metalKey = document.getElementById('metal-select').value;
            const semiKey = document.getElementById('semi-select').value;
            const doping = document.getElementById('doping-select').value;
            const biasState = document.getElementById('bias-select').value;

            const isIsolated = (biasState === 'isolated');

            const wf_m = metals[metalKey];
            const chi = semiconductors[semiKey].chi;
            const eg = semiconductors[semiKey].eg;

            const offset = (doping.includes('+')) ? 0.05 : 0.25;
            const isNType = doping.includes('n');

            let wf_s, phi_b, V_bi, isOhmic;

            // Ideal Base Mathematics
            if (isNType) {
                wf_s = chi + offset; 
                phi_b = wf_m - chi;  
                V_bi = wf_m - wf_s;  
            } else {
                wf_s = (chi + eg) - offset;
                phi_b = (chi + eg) - wf_m; 
                V_bi = wf_s - wf_m;
            }

            isOhmic = V_bi <= 0;

            // Handle Bias 
            let V_app = 0;
            if (!isOhmic && !isIsolated) {
                if (biasState === 'forward') {
                    V_app = Math.min(0.25, V_bi * 0.8); 
                } else if (biasState === 'reverse') {
                    V_app = -0.8;
                }
            }

            let energy_shift_s = 0; 
            if (!isIsolated) {
                if (isNType) energy_shift_s = V_app; 
                else energy_shift_s = -V_app;        
            }

            // Positions and Layout
            let X_M_END = isIsolated ? 200 : X_INT;
            let X_S_START = isIsolated ? 320 : X_INT;
            let Y_VAC = 50;

            let Y_EF_m, Y_EF_s, Y_cb, Y_vb, Y_c0, Y_v0, Y_EFi;

            if (isIsolated) {
                Y_EF_m = Y_VAC + wf_m * SCALE;
                Y_cb = Y_VAC + chi * SCALE;
                Y_vb = Y_cb + eg * SCALE;
                Y_EF_s = Y_VAC + wf_s * SCALE;
                Y_EFi = Y_cb + (eg / 2) * SCALE;
                Y_c0 = Y_cb; // Flat bands
                Y_v0 = Y_vb; // Flat bands
            } else {
                Y_EF_m = Y_EF;
                Y_EF_s = Y_EF_m - (energy_shift_s * SCALE);
                
                if (isNType) {
                    Y_c0 = Y_EF_m - (phi_b * SCALE);
                    Y_v0 = Y_c0 + (eg * SCALE);
                    Y_cb = Y_EF_s - (offset * SCALE);
                    Y_vb = Y_cb + (eg * SCALE);
                } else {
                    Y_v0 = Y_EF_m + (phi_b * SCALE);
                    Y_c0 = Y_v0 - (eg * SCALE);
                    Y_vb = Y_EF_s + (offset * SCALE);
                    Y_cb = Y_vb - (eg * SCALE);
                }
            }

            // Depletion Width scaled dynamically
            let base_W = (doping.includes('+')) ? 90 : 220;
            let W = 0;
            if (!isOhmic && !isIsolated) {
                let V_total = V_bi - V_app;
                if (V_total < 0.05) V_total = 0.05; 
                W = base_W * Math.sqrt(V_total / V_bi);
            }
            const X_END = X_S_START + W;
            const X_MAX = 750;

            // === 1. Draw Metal Shape ===
            const m_d = `M 0,${Y_EF_m + 60} L 100,${Y_EF_m + 60} L 100,${Y_EF_m} L ${X_M_END},${Y_EF_m} L ${X_M_END},570 L 0,570 Z`;
            document.getElementById('metal-region').setAttribute('d', m_d);

            // === 2. Draw Semiconductor Bands ===
            let dEc = `M ${X_S_START},${Y_c0} `;
            let dEv = `M ${X_S_START},${Y_v0} `;
            
            if (W > 0) {
                for(let i=0; i<=W; i+=5) {
                    let x = X_S_START + i;
                    let ratio = i/W;
                    let bend = Math.pow(1 - ratio, 2);
                    let y_c = Y_cb + (Y_c0 - Y_cb) * bend;
                    let y_v = Y_vb + (Y_v0 - Y_vb) * bend;
                    dEc += `L ${x},${y_c} `;
                    dEv += `L ${x},${y_v} `;
                }
            } else {
                dEc += `L ${X_S_START},${Y_cb} `;
                dEv += `L ${X_S_START},${Y_vb} `;
            }
            dEc += `L ${X_MAX},${Y_cb}`;
            dEv += `L ${X_MAX},${Y_vb}`;

            document.getElementById('ec-line').setAttribute('d', dEc);
            document.getElementById('ev-line').setAttribute('d', dEv);

            let dEvFill = dEv + ` L ${X_MAX},570 L ${X_S_START},570 Z`;
            document.getElementById('val-region').setAttribute('d', dEvFill);

            // Update Surfaces
            document.getElementById('surf-m').setAttribute('x1', X_M_END);
            document.getElementById('surf-m').setAttribute('x2', X_M_END);
            document.getElementById('surf-m').setAttribute('y1', isIsolated ? Y_VAC : 120);
            
            document.getElementById('surf-s').setAttribute('x1', X_S_START);
            document.getElementById('surf-s').setAttribute('x2', X_S_START);
            document.getElementById('surf-s').setAttribute('y1', isIsolated ? Y_VAC : 120);

            // Positioning text and lines
            document.getElementById('ec-label').setAttribute('y', Y_cb + 5);
            document.getElementById('ev-label').setAttribute('y', Y_vb + 5);
            
            document.getElementById('ef-metal').setAttribute('x1', 50);
            document.getElementById('ef-metal').setAttribute('x2', X_M_END);
            document.getElementById('ef-metal').setAttribute('y1', Y_EF_m);
            document.getElementById('ef-metal').setAttribute('y2', Y_EF_m);
            
            document.getElementById('ef-semi').setAttribute('x1', X_S_START);
            document.getElementById('ef-semi').setAttribute('x2', 750);
            document.getElementById('ef-semi').setAttribute('y1', Y_EF_s);
            document.getElementById('ef-semi').setAttribute('y2', Y_EF_s);

            document.getElementById('ef-label-m').setAttribute('x', 50);
            document.getElementById('ef-label-m').setAttribute('y', Y_EF_m - 10);
            document.getElementById('ef-label-s').setAttribute('x', 760);
            document.getElementById('ef-label-s').setAttribute('y', Y_EF_s + 5);

            document.getElementById('label-x0').setAttribute('x', X_S_START - 40);

            // === 3. Annotations ===
            const displayIsolated = isIsolated ? 'block' : 'none';
            const displayConnected = (!isIsolated && !isOhmic) ? 'block' : 'none';
            
            // Toggle Isolated elements
            document.getElementById('vac-m').style.display = displayIsolated;
            document.getElementById('vac-s').style.display = displayIsolated;
            document.getElementById('arrow-phi-m').style.display = displayIsolated;
            document.getElementById('label-phi-m').style.display = displayIsolated;
            document.getElementById('arrow-chi').style.display = displayIsolated;
            document.getElementById('label-chi').style.display = displayIsolated;
            document.getElementById('arrow-phi-s').style.display = displayIsolated;
            document.getElementById('label-phi-s').style.display = displayIsolated;
            document.getElementById('efi-line').style.display = displayIsolated;
            document.getElementById('efi-label').style.display = displayIsolated;

            // Toggle Connected Schottky elements
            document.getElementById('arrow-phi').style.display = displayConnected;
            document.getElementById('label-phi').style.display = displayConnected;
            document.getElementById('label-phi-name').style.display = displayConnected;
            document.getElementById('arrow-vbi').style.display = displayConnected;
            document.getElementById('label-vbi').style.display = displayConnected;
            document.getElementById('ext-ec0').style.display = displayConnected;
            document.getElementById('ext-c0-right').style.display = displayConnected;
            
            document.getElementById('line-xn').setAttribute('x1', X_END);
            document.getElementById('line-xn').setAttribute('x2', X_END);
            document.getElementById('line-xn').setAttribute('y1', isNType ? Y_cb - 20 : Y_cb + 20);
            document.getElementById('line-xn').setAttribute('y2', isNType ? Y_vb + 20 : Y_vb - 20);
            document.getElementById('label-xn').setAttribute('x', X_END - 20);
            document.getElementById('label-xn').setAttribute('y', isNType ? Y_vb + 45 : Y_cb - 30);

            if (isIsolated || isOhmic) {
                document.getElementById('line-xn').style.display = 'none';
                document.getElementById('label-xn').style.display = 'none';
            } else {
                document.getElementById('line-xn').style.display = 'block';
                document.getElementById('label-xn').style.display = 'block';
            }

            if (isIsolated) {
                document.getElementById('vac-m').setAttribute('x1', X_M_END - 80);
                document.getElementById('vac-m').setAttribute('y1', Y_VAC);
                document.getElementById('vac-m').setAttribute('x2', X_M_END);
                document.getElementById('vac-m').setAttribute('y2', Y_VAC);

                document.getElementById('vac-s').setAttribute('x1', X_S_START);
                document.getElementById('vac-s').setAttribute('y1', Y_VAC);
                document.getElementById('vac-s').setAttribute('x2', X_S_START + 120);
                document.getElementById('vac-s').setAttribute('y2', Y_VAC);

                let m_x = X_M_END - 40;
                document.getElementById('arrow-phi-m').setAttribute('x1', m_x);
                document.getElementById('arrow-phi-m').setAttribute('y1', Y_VAC + 5);
                document.getElementById('arrow-phi-m').setAttribute('x2', m_x);
                document.getElementById('arrow-phi-m').setAttribute('y2', Y_EF_m - 5);
                document.getElementById('label-phi-m').setAttribute('x', m_x - 35);
                document.getElementById('label-phi-m').setAttribute('y', (Y_VAC + Y_EF_m)/2 + 5);

                let chi_x = X_S_START + 30;
                document.getElementById('arrow-chi').setAttribute('x1', chi_x);
                document.getElementById('arrow-chi').setAttribute('y1', Y_VAC + 5);
                document.getElementById('arrow-chi').setAttribute('x2', chi_x);
                document.getElementById('arrow-chi').setAttribute('y2', Y_cb - 5);
                document.getElementById('label-chi').setAttribute('x', chi_x - 25);
                document.getElementById('label-chi').setAttribute('y', (Y_VAC + Y_cb)/2 + 5);

                let s_x = X_S_START + 90;
                document.getElementById('arrow-phi-s').setAttribute('x1', s_x);
                document.getElementById('arrow-phi-s').setAttribute('y1', Y_VAC + 5);
                document.getElementById('arrow-phi-s').setAttribute('x2', s_x);
                document.getElementById('arrow-phi-s').setAttribute('y2', Y_EF_s - 5);
                document.getElementById('label-phi-s').setAttribute('x', s_x + 10);
                document.getElementById('label-phi-s').setAttribute('y', (Y_VAC + Y_EF_s)/2 + 5);

                document.getElementById('efi-line').setAttribute('x1', X_S_START);
                document.getElementById('efi-line').setAttribute('y1', Y_EFi);
                document.getElementById('efi-line').setAttribute('x2', X_MAX);
                document.getElementById('efi-line').setAttribute('y2', Y_EFi);
                document.getElementById('efi-label').setAttribute('y', Y_EFi + 5);
            } else if (!isOhmic) {
                let vbi_text = "e(V_{bi})";
                if (biasState === 'forward') vbi_text = "e(V_{bi} - V_F)";
                else if (biasState === 'reverse') vbi_text = "e(V_{bi} + V_R)";

                if (isNType) {
                    let extX = X_INT - 60;
                    document.getElementById('ext-ec0').setAttribute('x1', extX);
                    document.getElementById('ext-ec0').setAttribute('y1', Y_c0);
                    document.getElementById('ext-ec0').setAttribute('x2', X_INT);
                    document.getElementById('ext-ec0').setAttribute('y2', Y_c0);

                    document.getElementById('arrow-phi').setAttribute('x1', extX + 15);
                    document.getElementById('arrow-phi').setAttribute('y1', Y_c0 + 5);
                    document.getElementById('arrow-phi').setAttribute('x2', extX + 15);
                    document.getElementById('arrow-phi').setAttribute('y2', Y_EF_m - 5);
                    
                    document.getElementById('label-phi').textContent = "eφ_B0";
                    document.getElementById('label-phi').setAttribute('x', extX - 25);
                    document.getElementById('label-phi').setAttribute('y', (Y_c0 + Y_EF_m)/2 + 5);
                    document.getElementById('label-phi-name').setAttribute('x', extX - 50);
                    document.getElementById('label-phi-name').setAttribute('y', (Y_c0 + Y_EF_m)/2 + 25);

                    document.getElementById('ext-c0-right').setAttribute('x1', X_INT);
                    document.getElementById('ext-c0-right').setAttribute('y1', Y_c0);
                    document.getElementById('ext-c0-right').setAttribute('x2', X_END);
                    document.getElementById('ext-c0-right').setAttribute('y2', Y_c0);

                    document.getElementById('arrow-vbi').setAttribute('x1', X_END);
                    document.getElementById('arrow-vbi').setAttribute('y1', Y_c0 + 5);
                    document.getElementById('arrow-vbi').setAttribute('x2', X_END);
                    document.getElementById('arrow-vbi').setAttribute('y2', Y_cb - 5);

                    document.getElementById('label-vbi').textContent = vbi_text;
                    document.getElementById('label-vbi').setAttribute('x', X_END + 10);
                    document.getElementById('label-vbi').setAttribute('y', (Y_c0 + Y_cb)/2 + 5);

                } else {
                    let extX = X_INT - 60;
                    document.getElementById('ext-ec0').setAttribute('x1', extX);
                    document.getElementById('ext-ec0').setAttribute('y1', Y_v0);
                    document.getElementById('ext-ec0').setAttribute('x2', X_INT);
                    document.getElementById('ext-ec0').setAttribute('y2', Y_v0);

                    document.getElementById('arrow-phi').setAttribute('x1', extX + 15);
                    document.getElementById('arrow-phi').setAttribute('y1', Y_EF_m + 5);
                    document.getElementById('arrow-phi').setAttribute('x2', extX + 15);
                    document.getElementById('arrow-phi').setAttribute('y2', Y_v0 - 5);
                    
                    document.getElementById('label-phi').textContent = "eφ_Bp";
                    document.getElementById('label-phi').setAttribute('x', extX - 25);
                    document.getElementById('label-phi').setAttribute('y', (Y_v0 + Y_EF_m)/2 + 5);
                    document.getElementById('label-phi-name').setAttribute('x', extX - 50);
                    document.getElementById('label-phi-name').setAttribute('y', (Y_v0 + Y_EF_m)/2 + 25);

                    document.getElementById('ext-c0-right').setAttribute('x1', X_INT);
                    document.getElementById('ext-c0-right').setAttribute('y1', Y_v0);
                    document.getElementById('ext-c0-right').setAttribute('x2', X_END);
                    document.getElementById('ext-c0-right').setAttribute('y2', Y_v0);

                    document.getElementById('arrow-vbi').setAttribute('x1', X_END);
                    document.getElementById('arrow-vbi').setAttribute('y1', Y_vb + 5);
                    document.getElementById('arrow-vbi').setAttribute('x2', X_END);
                    document.getElementById('arrow-vbi').setAttribute('y2', Y_v0 - 5);

                    document.getElementById('label-vbi').textContent = vbi_text;
                    document.getElementById('label-vbi').setAttribute('x', X_END + 10);
                    document.getElementById('label-vbi').setAttribute('y', (Y_v0 + Y_vb)/2 + 5);
                }
            }

            // === 4. Update Analysis ===
            const htmlText = `
                Metal Work Function (Φ<sub>m</sub>): <span class="data-value">${wf_m.toFixed(2)} eV</span><br>
                Semiconductor Work Function (Φ<sub>s</sub>): <span class="data-value">${wf_s.toFixed(2)} eV</span><br>
                Calculated Barrier (Φ<sub>B0</sub>): <span class="data-value">${isOhmic ? '0.00' : Math.abs(phi_b).toFixed(2)} eV</span><br>
                Built-in Potential (V<sub>bi</sub>): <span class="data-value">${V_bi.toFixed(2)} V</span>
            `;
            document.getElementById('analysis-text').innerHTML = htmlText;
            
            const statusBox = document.getElementById('contact-status');
            
            if (isIsolated) {
                statusBox.innerHTML = `<span style="color: var(--primary); font-weight: bold; font-size: 1.2rem;">Isolated (Before Contact)</span><br><span style="color: #555;">(Vacuum levels aligned. No band bending has occurred yet.)</span>`;
            } else if (isOhmic) {
                statusBox.innerHTML = `<span class="ohmic-warning" style="font-size: 1.2rem;">Ohmic Contact / Accumulation Layer</span><br><span style="color: #555;">(No rectifying barrier is formed.)</span>`;
            } else {
                let stateLabel = "Equilibrium";
                if (biasState === 'forward') stateLabel = `Forward Bias (${V_app.toFixed(2)}V)`;
                if (biasState === 'reverse') stateLabel = `Reverse Bias (${Math.abs(V_app).toFixed(2)}V)`;
                
                statusBox.innerHTML = `<span style="color: var(--primary); font-weight: bold; font-size: 1.2rem;">Rectifying Contact - ${stateLabel}</span><br><span style="color: #555;">(Depletion width and band bending updated.)</span>`;
            }
        }

        window.onload = updateDiagram;
    </script>
</body>
</html>
