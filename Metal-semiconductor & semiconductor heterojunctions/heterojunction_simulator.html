<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Heterojunction Simulator</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --panel-bg: #ffffff;
            --text-main: #1e293b;
            --primary: #2563eb;
            --ec-color: #ef4444; /* Red for Conduction */
            --ev-color: #3b82f6; /* Blue for Valence */
            --ef-color: #10b981; /* Green for Fermi */
            --border: #cbd5e1;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            background-color: var(--panel-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 30px;
            max-width: 950px;
            width: 100%;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: #0f172a;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .controls-container {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .control-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-weight: 600;
            font-size: 0.95rem;
            color: #334155;
        }

        select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #94a3b8;
            font-size: 1rem;
            background-color: white;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .svg-container {
            width: 100%;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.02);
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .band-path {
            fill: none;
            stroke-width: 3.5;
        }
        
        .band-line {
            stroke-width: 3.5;
            transition: y1 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), y2 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .ec { stroke: var(--ec-color); }
        .ev { stroke: var(--ev-color); }
        .ef { 
            stroke: var(--ef-color); 
            stroke-width: 2; 
            stroke-dasharray: 8 4; 
        }

        .interface-line {
            stroke: #94a3b8;
            stroke-width: 1.5;
            stroke-dasharray: 6 4;
        }

        .label {
            font-size: 16px;
            font-weight: 600;
            fill: var(--text-main);
            user-select: none;
        }
        
        .math {
            font-family: "Times New Roman", Times, serif;
            font-style: italic;
        }

        .analysis-box {
            margin-top: 20px;
            padding: 15px 20px;
            background-color: #e0f2fe;
            border-left: 4px solid var(--primary);
            border-radius: 4px;
            font-size: 1rem;
            line-height: 1.6;
        }

        .analysis-title {
            font-weight: bold;
            color: #0369a1;
            margin-bottom: 5px;
            display: block;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 15px;
            font-size: 0.95rem;
            font-weight: 500;
        }
        
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .legend-color { width: 24px; height: 4px; border-radius: 2px;}

    </style>
</head>
<body>

    <div class="container">
        <h2>Universal Heterojunction Simulator</h2>
        
        <div class="controls-container">
            <div class="control-group">
                <label for="left-doping">Left Material Doping</label>
                <select id="left-doping" onchange="updateDiagram()">
                    <optgroup label="Wide Bandgap (AlGaAs)">
                        <option value="N++">N++ (Degenerate N-type)</option>
                        <option value="N+" selected>N+ (Heavy N-type)</option>
                        <option value="N">N (Moderate N-type)</option>
                        <option value="I">I (Intrinsic)</option>
                        <option value="P">P (Moderate P-type)</option>
                        <option value="P+">P+ (Heavy P-type)</option>
                        <option value="P++">P++ (Degenerate P-type)</option>
                    </optgroup>
                    <optgroup label="Narrow Bandgap (GaAs)">
                        <option value="n++">n++ (Degenerate n-type)</option>
                        <option value="n+">n+ (Heavy n-type)</option>
                        <option value="n">n (Moderate n-type)</option>
                        <option value="i">i (Intrinsic)</option>
                        <option value="p">p (Moderate p-type)</option>
                        <option value="p+">p+ (Heavy p-type)</option>
                        <option value="p++">p++ (Degenerate p-type)</option>
                    </optgroup>
                </select>
            </div>
            
            <div class="control-group">
                <label for="right-doping">Right Material Doping</label>
                <select id="right-doping" onchange="updateDiagram()">
                    <optgroup label="Wide Bandgap (AlGaAs)">
                        <option value="N++">N++ (Degenerate N-type)</option>
                        <option value="N+">N+ (Heavy N-type)</option>
                        <option value="N">N (Moderate N-type)</option>
                        <option value="I">I (Intrinsic)</option>
                        <option value="P">P (Moderate P-type)</option>
                        <option value="P+">P+ (Heavy P-type)</option>
                        <option value="P++">P++ (Degenerate P-type)</option>
                    </optgroup>
                    <optgroup label="Narrow Bandgap (GaAs)">
                        <option value="n++">n++ (Degenerate n-type)</option>
                        <option value="n+">n+ (Heavy n-type)</option>
                        <option value="n">n (Moderate n-type)</option>
                        <option value="i">i (Intrinsic)</option>
                        <option value="p" selected>p (Moderate p-type)</option>
                        <option value="p+">p+ (Heavy p-type)</option>
                        <option value="p++">p++ (Degenerate p-type)</option>
                    </optgroup>
                </select>
            </div>
        </div>

        <div class="svg-container">
            <svg viewBox="0 0 800 600" id="diagram">
                <!-- Interface Line -->
                <line x1="400" y1="30" x2="400" y2="570" class="interface-line" />
                
                <!-- Dynamic Material Labels -->
                <text x="200" y="40" id="left-mat-label" class="label" text-anchor="middle">Material 1</text>
                <text x="600" y="40" id="right-mat-label" class="label" text-anchor="middle">Material 2</text>

                <!-- Fermi Level -->
                <line x1="0" y1="300" x2="800" y2="300" class="ef" />
                <text x="760" y="290" class="label math" style="fill: var(--ef-color);">E_F</text>

                <!-- Band Paths -->
                <path id="left-ec" class="band-path ec" />
                <path id="right-ec" class="band-path ec" />
                <path id="left-ev" class="band-path ev" />
                <path id="right-ev" class="band-path ev" />

                <!-- Discontinuity Vertical Lines -->
                <line id="delta-ec-line" x1="400" x2="400" class="band-line ec" />
                <line id="delta-ev-line" x1="400" x2="400" class="band-line ev" />

                <!-- Discontinuity Labels -->
                <text id="delta-ec-text" x="410" class="label math" style="font-size: 14px; fill: var(--ec-color);">ΔE_c</text>
                <text id="delta-ev-text" x="410" class="label math" style="font-size: 14px; fill: var(--ev-color);">ΔE_v</text>

                <!-- Band Labels -->
                <text x="20" id="label-ec-l" class="label math" style="fill: var(--ec-color);">E_c</text>
                <text x="20" id="label-ev-l" class="label math" style="fill: var(--ev-color);">E_v</text>
                <text x="760" id="label-ec-r" class="label math" style="fill: var(--ec-color);">E_c</text>
                <text x="760" id="label-ev-r" class="label math" style="fill: var(--ev-color);">E_v</text>
                
                <!-- Author Signature -->
                <text x="780" y="580" class="label" style="font-size: 14px; fill: #64748b; text-anchor: end; font-weight: normal;">Mahmudul Hasan(2202156)</text>
            </svg>
        </div>

        <div class="legend">
            <div class="legend-item"><div class="legend-color" style="background: var(--ec-color);"></div> Conduction Band (E<sub>c</sub>)</div>
            <div class="legend-item"><div class="legend-color" style="background: var(--ev-color);"></div> Valence Band (E<sub>v</sub>)</div>
            <div class="legend-item"><div class="legend-color" style="background: var(--ef-color); border-bottom: 2px dashed var(--ef-color); height:0; width:24px; border-radius:0;"></div> Fermi Level (E<sub>F</sub>)</div>
        </div>

        <div class="analysis-box">
            <span class="analysis-title" id="junction-type">Junction Type:</span>
            <span id="analysis-text">Select doping parameters to view junction behavior.</span>
        </div>
    </div>

    <script>
        /**
         * Dynamic Vacuum-Aligned Physics Engine
         * Handles Any-to-Any Junctions (Homo & Heterojunctions)
         */
        const SCALE = 120; // Pixels per eV
        const Y_EF = 300;  // Fixed Fermi Level Y position

        // Material Properties Definitions
        const MAT = {
            'WIDE': { eg: 1.85, chi: 3.783, name: 'Al₀.₃Ga₀.₇As' }, // chi is set so dEc = 0.287 relative to GaAs
            'NARROW': { eg: 1.42, chi: 4.07, name: 'GaAs' }
        };

        // Doping Profiles mapped to specific material bands based on case
        const dopingProfiles = {
            "N++": { type: "n", offset: -0.1, weight: 1000, band: 'WIDE', raw: 'N++' },
            "N+":  { type: "n", offset: 0.0,  weight: 100,  band: 'WIDE', raw: 'N+' },
            "N":   { type: "n", offset: 0.15, weight: 10,   band: 'WIDE', raw: 'N' },
            "I":   { type: "i", offset: "mid",weight: 1,    band: 'WIDE', raw: 'I' },
            "P":   { type: "p", offset: 0.15, weight: 10,   band: 'WIDE', raw: 'P' },
            "P+":  { type: "p", offset: 0.0,  weight: 100,  band: 'WIDE', raw: 'P+' },
            "P++": { type: "p", offset: -0.1, weight: 1000, band: 'WIDE', raw: 'P++' },
            "n++": { type: "n", offset: -0.1, weight: 1000, band: 'NARROW', raw: 'n++' },
            "n+":  { type: "n", offset: 0.0,  weight: 100,  band: 'NARROW', raw: 'n+' },
            "n":   { type: "n", offset: 0.15, weight: 10,   band: 'NARROW', raw: 'n' },
            "i":   { type: "i", offset: "mid",weight: 1,    band: 'NARROW', raw: 'i' },
            "p":   { type: "p", offset: 0.15, weight: 10,   band: 'NARROW', raw: 'p' },
            "p+":  { type: "p", offset: 0.0,  weight: 100,  band: 'NARROW', raw: 'p+' },
            "p++": { type: "p", offset: -0.1, weight: 1000, band: 'NARROW', raw: 'p++' }
        };

        function updateDiagram() {
            const leftMatStr = document.getElementById('left-doping').value;
            const rightMatStr = document.getElementById('right-doping').value;

            const l_prof = dopingProfiles[leftMatStr];
            const r_prof = dopingProfiles[rightMatStr];

            const l_mat = MAT[l_prof.band];
            const r_mat = MAT[r_prof.band];

            // Update UI Labels
            document.getElementById('left-mat-label').textContent = `${l_mat.name} (Eg = ${l_mat.eg.toFixed(2)} eV)`;
            document.getElementById('right-mat-label').textContent = `${r_mat.name} (Eg = ${r_mat.eg.toFixed(2)} eV)`;

            // 1. Calculate Bulk Levels relative to E_F
            let Y_cL, Y_vL, Y_cR, Y_vR;

            // Left Bulk
            if (l_prof.type === 'i') {
                Y_cL = Y_EF - (l_mat.eg / 2) * SCALE;
            } else if (l_prof.type === 'n') {
                Y_cL = Y_EF - (l_prof.offset * SCALE);
            } else {
                Y_cL = Y_EF - (l_mat.eg * SCALE) + (l_prof.offset * SCALE);
            }
            Y_vL = Y_cL + (l_mat.eg * SCALE);

            // Right Bulk
            if (r_prof.type === 'i') {
                Y_cR = Y_EF - (r_mat.eg / 2) * SCALE;
            } else if (r_prof.type === 'n') {
                Y_cR = Y_EF - (r_prof.offset * SCALE);
            } else {
                Y_cR = Y_EF - (r_mat.eg * SCALE) + (r_prof.offset * SCALE);
            }
            Y_vR = Y_cR + (r_mat.eg * SCALE);

            // 2. Determine Vacuum Alignment & Built-in Potential
            // Vacuum level in bulk = Ec bulk - Electron Affinity
            const Y_vac_L_bulk = Y_cL - (l_mat.chi * SCALE);
            const Y_vac_R_bulk = Y_cR - (r_mat.chi * SCALE);

            // Total bending required to align vacuum levels (Vbi)
            const Vbi_px = Y_vac_R_bulk - Y_vac_L_bulk; 

            // Split bending inversely proportional to doping weight (depletion width analog)
            const wL = l_prof.weight;
            const wR = r_prof.weight;
            const bend_L_px = Vbi_px * (wR / (wL + wR));
            const bend_R_px = Vbi_px * (wL / (wL + wR)); // Used implicitly below

            // 3. Calculate Interface Positions
            const Y_vac_int = Y_vac_L_bulk + bend_L_px;

            const Y_cL_int = Y_vac_int + (l_mat.chi * SCALE);
            const Y_vL_int = Y_cL_int + (l_mat.eg * SCALE);
            
            const Y_cR_int = Y_vac_int + (r_mat.chi * SCALE);
            const Y_vR_int = Y_cR_int + (r_mat.eg * SCALE);

            // 4. Generate Bezier Curves for Band Bending
            const path_L_Ec = `M 0 ${Y_cL} Q 400 ${Y_cL} 400 ${Y_cL_int}`;
            const path_R_Ec = `M 400 ${Y_cR_int} Q 400 ${Y_cR} 800 ${Y_cR}`;
            const path_L_Ev = `M 0 ${Y_vL} Q 400 ${Y_vL} 400 ${Y_vL_int}`;
            const path_R_Ev = `M 400 ${Y_vR_int} Q 400 ${Y_vR} 800 ${Y_vR}`;

            // Apply Paths
            document.getElementById('left-ec').setAttribute('d', path_L_Ec);
            document.getElementById('right-ec').setAttribute('d', path_R_Ec);
            document.getElementById('left-ev').setAttribute('d', path_L_Ev);
            document.getElementById('right-ev').setAttribute('d', path_R_Ev);

            // Apply Interface Discontinuity Lines
            const dEc_px = Math.abs(Y_cL_int - Y_cR_int);
            const dEv_px = Math.abs(Y_vL_int - Y_vR_int);

            const ecLine = document.getElementById('delta-ec-line');
            const evLine = document.getElementById('delta-ev-line');
            const ecText = document.getElementById('delta-ec-text');
            const evText = document.getElementById('delta-ev-text');

            if (dEc_px > 1) {
                ecLine.style.display = 'block';
                ecText.style.display = 'block';
                ecLine.setAttribute('y1', Y_cL_int);
                ecLine.setAttribute('y2', Y_cR_int);
                ecText.setAttribute('y', (Y_cL_int + Y_cR_int) / 2 + 5);
            } else {
                ecLine.style.display = 'none';
                ecText.style.display = 'none';
            }

            if (dEv_px > 1) {
                evLine.style.display = 'block';
                evText.style.display = 'block';
                evLine.setAttribute('y1', Y_vL_int);
                evLine.setAttribute('y2', Y_vR_int);
                evText.setAttribute('y', (Y_vL_int + Y_vR_int) / 2 + 5);
            } else {
                evLine.style.display = 'none';
                evText.style.display = 'none';
            }

            // Update Labels Positioning
            document.getElementById('label-ec-l').setAttribute('y', Y_cL - 10);
            document.getElementById('label-ev-l').setAttribute('y', Y_vL + 20);
            document.getElementById('label-ec-r').setAttribute('y', Y_cR - 10);
            document.getElementById('label-ev-r').setAttribute('y', Y_vR + 20);

            // 5. Generate Dynamic Analysis Text
            generateAnalysis(l_prof, r_prof, l_mat, r_mat);
        }

        function generateAnalysis(l_prof, r_prof, l_mat, r_mat) {
            const titleEl = document.getElementById('junction-type');
            const textEl = document.getElementById('analysis-text');

            const isHomojunction = (l_prof.band === r_prof.band);
            
            let typeStr = "";
            if (l_prof.type === 'i' && r_prof.type === 'i') typeStr = "Intrinsic";
            else if (l_prof.type === 'i' || r_prof.type === 'i') typeStr = "Doped-Intrinsic";
            else if (l_prof.type === r_prof.type) typeStr = `Isotype (${l_prof.raw}-${r_prof.raw})`;
            else typeStr = `Anisotype (${l_prof.raw}-${r_prof.raw})`;

            typeStr += isHomojunction ? " Homojunction" : " Heterojunction";
            
            titleEl.innerText = `${l_mat.name} / ${r_mat.name} | ${typeStr}`;

            let desc = "";
            
            if (isHomojunction) {
                desc += "Because both materials share the same bandgap and electron affinity, the bands align perfectly without discontinuities (ΔE_c = 0, ΔE_v = 0). ";
            } else {
                const dEc_val = Math.abs(l_mat.chi - r_mat.chi);
                const l_ev_aff = l_mat.chi + l_mat.eg;
                const r_ev_aff = r_mat.chi + r_mat.eg;
                const dEv_val = Math.abs(l_ev_aff - r_ev_aff);
                
                desc += `The band offsets are strictly maintained at the interface based on Anderson's rule (ΔE_c ≈ ${dEc_val.toFixed(3)} eV, ΔE_v ≈ ${dEv_val.toFixed(3)} eV). `;
            }

            if (l_prof.type === 'n' && r_prof.type === 'p') {
                desc += "Electrons from the n-side and holes from the p-side recombine, creating a wide depletion region. ";
                if (!isHomojunction) desc += "Notice the characteristic 'spike' and 'notch' depending on the orientation, which can impede carrier flow.";
            } else if (l_prof.type === 'p' && r_prof.type === 'n') {
                desc += "This forms a depletion region. If doping is heavy enough (e.g., P++ / n++), the bands will cross the Fermi level on both sides, allowing for quantum tunneling (Esaki diode behavior).";
            } else if ((l_prof.type === 'n' && r_prof.type === 'i') || (l_prof.type === 'i' && r_prof.type === 'n')) {
                if (!isHomojunction && ((l_prof.type === 'n' && l_prof.band === 'WIDE') || (r_prof.type === 'n' && r_prof.band === 'WIDE'))) {
                    desc += "Electrons from the doped wide-bandgap material spill over into the undoped narrow-bandgap material, forming a Two-Dimensional Electron Gas (2DEG) accumulation layer (High Electron Mobility Transistor principle).";
                } else {
                    desc += "Carriers from the doped side spill into the intrinsic side, establishing a localized accumulation/depletion boundary.";
                }
            } else if (l_prof.type === r_prof.type && l_prof.type !== 'i') {
                desc += `One side accumulates carriers while the other depletes, driven purely by the difference in work functions and bandgaps to align the Fermi levels in equilibrium.`;
            } else if (l_prof.raw.includes('++') || r_prof.raw.includes('++')) {
                desc += "The presence of degenerate (++) doping pushes the Fermi level into the allowed bands. Band bending occurs predominantly in the lighter-doped material.";
            } else {
                desc += "The bands bend to align the chemical potentials (Fermi levels) in thermal equilibrium, satisfying Poisson's equation across the interface.";
            }

            textEl.innerText = desc;
        }

        // Initialize on load
        window.onload = updateDiagram;
    </script>
</body>
</html>
